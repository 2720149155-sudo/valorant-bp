# 保活：每 5 分钟 ping 一次线上站，防止 Render 免费版 15 分钟无访问后休眠。
# 与 UptimeRobot 的 ping 互为备份。仓库是公开的，公开仓库的 Actions 不计费。
# 注意：GitHub 会在仓库 60 天无活动后停用定时任务，平时正常 push 代码即可。
name: keep-alive
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping homepage and health
        run: |
          curl -fsS -o /dev/null -w "homepage %{http_code} %{time_total}s\n" https://sztu-valorant-bp.onrender.com/
          curl -fsS -o /dev/null -w "health %{http_code}\n" https://sztu-valorant-bp.onrender.com/api/health
